<title>Meridian Commerce OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================= TOKENS ============================= */
:root{
  color-scheme: light;
  --font-display: 'Manrope', system-ui, sans-serif;
  --font-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* content surfaces */
  --bg-page: #f5f6f9;
  --bg-surface: #ffffff;
  --bg-surface-2: #fafbfc;
  --bg-surface-hover: #f2f4f7;
  --ink-primary: #10131a;
  --ink-secondary: #545b68;
  --ink-muted: #8c919d;
  --border: rgba(16,19,26,0.10);
  --border-strong: rgba(16,19,26,0.18);
  --shadow-sm: 0 1px 2px rgba(16,19,26,0.05);
  --shadow-md: 0 4px 16px rgba(16,19,26,0.08);
  --shadow-lg: 0 12px 32px rgba(16,19,26,0.14);

  /* accent (brand + chart sequential/slot-1) */
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --accent-wash: rgba(42,120,214,0.10);
  --accent-wash-strong: rgba(42,120,214,0.18);
  --accent-border: rgba(42,120,214,0.35);

  /* sidebar (fixed dark anchor, same in both themes) */
  --sb-bg: #0d1017;
  --sb-bg-2: #12151d;
  --sb-text: #aeb4c2;
  --sb-text-dim: #5b6070;
  --sb-text-active: #ffffff;
  --sb-border: rgba(255,255,255,0.07);
  --sb-active-bg: rgba(58,135,229,0.16);
  --sb-active-bar: #3987e5;
  --sb-hover-bg: rgba(255,255,255,0.05);

  /* categorical chart palette (light) */
  --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100;
  --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #4a3aa7; --cat-8: #e34948;

  /* status (fixed, mode-invariant) */
  --status-good: #0ca30c;      --status-good-bg: #e6f6e6;      --status-good-text: #0a6b0a;
  --status-warning: #fab219;   --status-warning-bg: #fef3d9;   --status-warning-text: #8a5a00;
  --status-serious: #ec835a;   --status-serious-bg: #fce7de;   --status-serious-text: #a8461f;
  --status-critical: #d03b3b;  --status-critical-bg: #fbe3e3;  --status-critical-text: #a52323;
  --status-neutral-bg: #eef0f3; --status-neutral-text: #545b68;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg-page: #0a0b0e; --bg-surface: #14161b; --bg-surface-2: #191b21; --bg-surface-hover: #20232a;
    --ink-primary: #f4f5f7; --ink-secondary: #b7bcc6; --ink-muted: #80858f;
    --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3); --shadow-md: 0 4px 16px rgba(0,0,0,0.4); --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
    --accent: #3987e5; --accent-wash: rgba(57,135,229,0.16); --accent-wash-strong: rgba(57,135,229,0.26); --accent-border: rgba(57,135,229,0.4);
    --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500;
    --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767;
    --status-good-bg: rgba(12,163,12,0.16); --status-good-text: #4fd44f;
    --status-warning-bg: rgba(250,178,25,0.16); --status-warning-text: #fab219;
    --status-serious-bg: rgba(236,131,90,0.16); --status-serious-text: #ec835a;
    --status-critical-bg: rgba(208,59,59,0.18); --status-critical-text: #e66767;
    --status-neutral-bg: rgba(255,255,255,0.08); --status-neutral-text: #b7bcc6;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg-page: #0a0b0e; --bg-surface: #14161b; --bg-surface-2: #191b21; --bg-surface-hover: #20232a;
  --ink-primary: #f4f5f7; --ink-secondary: #b7bcc6; --ink-muted: #80858f;
  --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3); --shadow-md: 0 4px 16px rgba(0,0,0,0.4); --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
  --accent: #3987e5; --accent-wash: rgba(57,135,229,0.16); --accent-wash-strong: rgba(57,135,229,0.26); --accent-border: rgba(57,135,229,0.4);
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500;
  --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767;
  --status-good-bg: rgba(12,163,12,0.16); --status-good-text: #4fd44f;
  --status-warning-bg: rgba(250,178,25,0.16); --status-warning-text: #fab219;
  --status-serious-bg: rgba(236,131,90,0.16); --status-serious-text: #ec835a;
  --status-critical-bg: rgba(208,59,59,0.18); --status-critical-text: #e66767;
  --status-neutral-bg: rgba(255,255,255,0.08); --status-neutral-text: #b7bcc6;
}

*,*::before,*::after{box-sizing:border-box;}
html{font-size:14px;}
body{
  margin:0; background:var(--bg-page); color:var(--ink-primary);
  font-family:var(--font-body); font-size:0.93rem; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance; color:var(--ink-primary);}
p{margin:0;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--accent-wash-strong);}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.tabular{font-variant-numeric:tabular-nums;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }

/* ============================= APP SHELL ============================= */
#app{display:flex; min-height:100vh;}

/* ---- Sidebar ---- */
#sidebar{
  width:248px; flex-shrink:0; background:var(--sb-bg); color:var(--sb-text);
  display:flex; flex-direction:column; height:100vh; position:sticky; top:0;
  border-right:1px solid var(--sb-border); z-index:40;
}
.sb-brand{display:flex; align-items:center; gap:9px; padding:16px 16px 14px; border-bottom:1px solid var(--sb-border);}
.sb-mark{width:26px; height:26px; border-radius:7px; background:linear-gradient(155deg,var(--accent),#1c5cab); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.sb-mark svg{width:15px;height:15px;}
.sb-brand-text{font-family:var(--font-display); font-weight:800; font-size:0.96rem; color:#fff; letter-spacing:-0.01em;}
.sb-brand-sub{font-size:0.62rem; color:var(--sb-text-dim); text-transform:uppercase; letter-spacing:0.07em; margin-top:1px;}
.sb-scroll{flex:1; overflow-y:auto; padding:10px 10px 8px;}
.sb-scroll::-webkit-scrollbar{width:8px;}
.sb-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08); border-radius:8px;}
.sb-group{margin-bottom:3px;}
.sb-group-label{font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--sb-text-dim); padding:12px 10px 5px;}
.sb-item{
  display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:7px; font-size:0.83rem; font-weight:500;
  color:var(--sb-text); cursor:pointer; text-decoration:none; position:relative; margin-bottom:1px; border:none; background:none; width:100%; text-align:left;
}
.sb-item svg{width:16px; height:16px; flex-shrink:0; opacity:0.85;}
.sb-item:hover{background:var(--sb-hover-bg); color:#fff;}
.sb-item.active{background:var(--sb-active-bg); color:var(--sb-text-active); font-weight:600;}
.sb-item.active::before{content:''; position:absolute; left:-10px; top:6px; bottom:6px; width:3px; border-radius:0 3px 3px 0; background:var(--sb-active-bar);}
.sb-item .count{margin-left:auto; font-size:0.68rem; font-family:var(--font-mono); color:var(--sb-text-dim); background:rgba(255,255,255,0.06); padding:1px 6px; border-radius:20px;}
.sb-item.active .count{color:#cfe0f7; background:rgba(255,255,255,0.12);}
/* AI zone — pushed to the top of the sidebar, given its own gradient identity */
.sb-group-ai{position:relative; margin-bottom:6px; padding-bottom:8px; border-bottom:1px solid var(--sb-border);}
.sb-group-ai .sb-group-label{display:flex; align-items:center; gap:5px; color:#b9a7f7; padding-top:8px;}
.sb-group-ai .sb-group-label svg{width:11px;height:11px;}
.sb-ai-tag{margin-left:auto; font-size:0.58rem; font-weight:800; letter-spacing:0.04em; text-transform:none; background:linear-gradient(90deg,var(--accent),#9085e9); -webkit-background-clip:text; background-clip:text; color:transparent; opacity:0.9;}
.sb-item-ai{position:relative;}
.sb-item-ai svg{color:#9085e9;}
.sb-item-ai:hover{background:linear-gradient(90deg,rgba(58,135,229,0.14),rgba(144,133,233,0.14));}
.sb-item-ai.active{background:linear-gradient(90deg,rgba(58,135,229,0.22),rgba(144,133,233,0.20));}
.sb-item-ai.active::before{background:linear-gradient(180deg,var(--accent),#9085e9);}
.sb-item-ai.active svg{color:#fff;}
.sb-badge-alert{background:var(--status-critical) !important; color:#fff !important; font-weight:800;}
@media (prefers-reduced-motion: no-preference){
  .sb-item-ai svg{ animation:ai-glow 3.2s ease-in-out infinite; }
}
@keyframes ai-glow{ 0%,100%{ filter:drop-shadow(0 0 0 rgba(144,133,233,0)); } 50%{ filter:drop-shadow(0 0 3px rgba(144,133,233,0.65)); } }
#sidebar-foot{border-top:1px solid var(--sb-border); padding:8px 10px 10px;}
.sb-store{display:flex; align-items:center; gap:9px; padding:8px 8px; border-radius:8px; cursor:pointer;}
.sb-store:hover{background:var(--sb-hover-bg);}
.sb-store-avatar{width:28px;height:28px;border-radius:7px;background:#1c2029;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:0.72rem;color:#fff;flex-shrink:0;border:1px solid var(--sb-border);}
.sb-store-name{font-size:0.78rem; font-weight:600; color:#fff;}
.sb-store-meta{font-size:0.66rem; color:var(--sb-text-dim);}

#sidebar-drawer-scrim{display:none;}

/* ---- Topbar ---- */
#main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  height:56px; flex-shrink:0; display:flex; align-items:center; gap:10px; padding:0 16px;
  background:var(--bg-surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:30;
}
#menu-toggle{display:none;}
.icon-btn{
  width:32px; height:32px; border-radius:7px; border:1px solid transparent; background:none; color:var(--ink-secondary);
  display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; flex-shrink:0;
}
.icon-btn svg{width:16px;height:16px;}
.icon-btn:hover{background:var(--bg-surface-hover); color:var(--ink-primary);}
.tb-search{
  flex:1; max-width:420px; display:flex; align-items:center; gap:8px; height:34px; padding:0 10px 0 11px;
  border:1px solid var(--border); border-radius:8px; background:var(--bg-surface-2); color:var(--ink-muted); cursor:pointer;
}
.tb-search:hover{border-color:var(--border-strong);}
.tb-search svg{width:14px;height:14px; flex-shrink:0;}
.tb-search span{font-size:0.8rem; flex:1;}
.tb-kbd{font-family:var(--font-mono); font-size:0.65rem; background:var(--bg-surface); border:1px solid var(--border); border-radius:4px; padding:1px 5px; color:var(--ink-muted);}
.tb-daterange{display:flex; align-items:center; gap:6px; height:34px; padding:0 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg-surface); cursor:pointer; font-size:0.78rem; font-weight:600; color:var(--ink-primary); white-space:nowrap;}
.tb-daterange svg{width:13px;height:13px; color:var(--ink-muted);}
.tb-spacer{flex:1;}
.tb-right{display:flex; align-items:center; gap:6px;}
.tb-store-sel{display:flex; align-items:center; gap:7px; height:34px; padding:0 9px; border:1px solid var(--border); border-radius:8px; background:var(--bg-surface); cursor:pointer; font-size:0.78rem; font-weight:600;}
.tb-dot{width:6px;height:6px;border-radius:50%;background:var(--status-good);}
.badge-dot{position:absolute; top:4px; right:4px; width:7px; height:7px; border-radius:50%; background:var(--status-critical); border:1.5px solid var(--bg-surface);}
.ai-btn{position:relative; display:flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;border:1px solid transparent;background:linear-gradient(var(--bg-surface),var(--bg-surface)) padding-box, linear-gradient(90deg,var(--accent),#9085e9) border-box;color:var(--accent);font-weight:700;font-size:0.78rem;cursor:pointer;}
.ai-btn:hover{background:linear-gradient(var(--accent-wash-strong),var(--accent-wash-strong)) padding-box, linear-gradient(90deg,var(--accent),#9085e9) border-box;}
.ai-btn svg{width:14px;height:14px;}
.ai-btn .ring{position:absolute; top:-3px; right:-3px; width:8px; height:8px; border-radius:50%; background:#9085e9;}
@media (prefers-reduced-motion: no-preference){
  .ai-btn .ring::before{content:''; position:absolute; inset:0; border-radius:50%; background:#9085e9; animation:ai-ping 2.4s cubic-bezier(0,0,0.2,1) infinite;}
}
@keyframes ai-ping{ 0%{ transform:scale(1); opacity:0.75; } 75%,100%{ transform:scale(2.4); opacity:0; } }
.tb-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(155deg,#4a3aa7,#2a78d6);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:0.72rem;cursor:pointer;border:none;}

/* ---- View area ---- */
#view-root{flex:1; padding:20px 24px 60px; max-width:1560px; width:100%; margin:0 auto;}
.breadcrumb{display:flex; align-items:center; gap:6px; font-size:0.76rem; color:var(--ink-muted); margin-bottom:10px;}
.breadcrumb a{color:var(--ink-muted); text-decoration:none; cursor:pointer;}
.breadcrumb a:hover{color:var(--accent);}
.page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
.page-title{font-size:1.32rem; font-weight:800; letter-spacing:-0.01em;}
.page-sub{font-size:0.82rem; color:var(--ink-secondary); margin-top:3px;}
.page-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

/* ============================= COMPONENTS ============================= */
.btn{display:inline-flex; align-items:center; gap:6px; height:33px; padding:0 13px; border-radius:8px; font-size:0.79rem; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--bg-surface); color:var(--ink-primary); white-space:nowrap;}
.btn svg{width:14px;height:14px;}
.btn:hover{background:var(--bg-surface-hover); border-color:var(--border-strong);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn.primary:hover{background:#2367bd;}
.btn.danger{background:var(--status-critical-bg); border-color:transparent; color:var(--status-critical-text);}
.btn.sm{height:28px; padding:0 10px; font-size:0.74rem;}
.btn.ghost{border-color:transparent; background:transparent;}
.btn.ghost:hover{background:var(--bg-surface-hover);}
.btn[disabled]{opacity:0.45; cursor:not-allowed;}

.card{background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border);}
.card-title{font-size:0.88rem; font-weight:700; font-family:var(--font-display);}
.card-title-sub{font-size:0.72rem; color:var(--ink-muted); font-weight:500; margin-top:2px;}
.card-body{padding:16px;}
.card-body.pad-0{padding:0;}

.grid{display:grid; gap:14px;}

/* KPI tiles */
.kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:12px; margin-bottom:16px;}
.kpi-tile{background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:13px 14px; box-shadow:var(--shadow-sm); min-width:0;}
.kpi-label{font-size:0.71rem; color:var(--ink-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.04em;}
.kpi-value{font-family:var(--font-display); font-size:1.5rem; font-weight:800; margin-top:5px; letter-spacing:-0.01em;}
.kpi-foot{display:flex; align-items:center; justify-content:space-between; margin-top:8px; gap:8px;}
.kpi-delta{font-size:0.72rem; font-weight:700; display:flex; align-items:center; gap:3px;}
.kpi-delta.up{color:var(--status-good-text);}
.kpi-delta.down{color:var(--status-critical-text);}
.kpi-delta svg{width:11px;height:11px;}
.kpi-vs{font-size:0.68rem; color:var(--ink-muted);}
.kpi-spark{width:58px; height:24px; flex-shrink:0;}

/* Status badges */
.badge{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px; font-size:0.7rem; font-weight:700; white-space:nowrap; line-height:1.6;}
.badge .dot{width:6px;height:6px;border-radius:50%; flex-shrink:0;}
.badge.good{background:var(--status-good-bg); color:var(--status-good-text);}
.badge.good .dot{background:var(--status-good);}
.badge.warning{background:var(--status-warning-bg); color:var(--status-warning-text);}
.badge.warning .dot{background:var(--status-warning);}
.badge.serious{background:var(--status-serious-bg); color:var(--status-serious-text);}
.badge.serious .dot{background:var(--status-serious);}
.badge.critical{background:var(--status-critical-bg); color:var(--status-critical-text);}
.badge.critical .dot{background:var(--status-critical);}
.badge.neutral{background:var(--status-neutral-bg); color:var(--status-neutral-text);}
.badge.neutral .dot{background:var(--ink-muted);}
.badge.accent{background:var(--accent-wash); color:var(--accent);}
.badge.accent .dot{background:var(--accent);}

/* Table */
.table-wrap{overflow-x:auto;}
table.dtable{width:100%; border-collapse:collapse; font-size:0.81rem;}
table.dtable thead th{
  position:sticky; top:0; background:var(--bg-surface-2); z-index:2; text-align:left; font-weight:700; font-size:0.68rem;
  text-transform:uppercase; letter-spacing:0.045em; color:var(--ink-muted); padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap;
}
table.dtable td{padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:middle; white-space:nowrap;}
table.dtable tbody tr{cursor:pointer;}
table.dtable tbody tr:hover{background:var(--bg-surface-hover);}
table.dtable tbody tr:last-child td{border-bottom:none;}
.cell-primary{font-weight:600; color:var(--ink-primary);}
.cell-muted{color:var(--ink-muted);}
.cell-wrap{white-space:normal;}
td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}
.chk{width:15px;height:15px; accent-color:var(--accent); cursor:pointer;}
.rowmeta{display:flex; align-items:center; gap:8px;}
.swatch{width:30px;height:30px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:0.62rem;}
.linktext{color:var(--accent); font-weight:600; cursor:pointer; font-family:var(--font-mono); font-size:0.79rem;}
.linktext:hover{text-decoration:underline;}

/* Filter bar */
.filter-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
.filter-search{display:flex; align-items:center; gap:7px; height:32px; padding:0 10px; border:1px solid var(--border); border-radius:7px; background:var(--bg-surface); min-width:200px; flex:1; max-width:280px;}
.filter-search svg{width:13px;height:13px; color:var(--ink-muted); flex-shrink:0;}
.filter-search input{border:none; outline:none; background:none; font-size:0.79rem; width:100%; color:var(--ink-primary); font-family:inherit;}
.chip-select{height:32px; padding:0 10px; border:1px solid var(--border); border-radius:7px; background:var(--bg-surface); font-size:0.78rem; font-weight:600; color:var(--ink-secondary); cursor:pointer;}
.chip-select:hover{border-color:var(--border-strong);}
.bulkbar{display:none; align-items:center; gap:10px; background:var(--accent-wash); border:1px solid var(--accent-border); border-radius:8px; padding:7px 12px; margin-bottom:10px; font-size:0.78rem; font-weight:600; color:var(--accent);}
.bulkbar.show{display:flex;}

/* Tabs */
.tabs{display:flex; align-items:center; gap:2px; border-bottom:1px solid var(--border); margin-bottom:16px; overflow-x:auto;}
.tab{padding:9px 3px; margin-right:18px; font-size:0.8rem; font-weight:600; color:var(--ink-muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
.tab:hover{color:var(--ink-primary);}
.tab.active{color:var(--accent); border-bottom-color:var(--accent);}

/* Empty / skeleton */
.empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:48px 20px; color:var(--ink-muted);}
.empty-state svg{width:34px;height:34px; margin-bottom:10px; opacity:0.5;}
.empty-state .t{font-weight:700; color:var(--ink-primary); font-size:0.9rem; margin-bottom:4px;}
.empty-state .d{font-size:0.8rem; max-width:320px;}
.skel{background:linear-gradient(90deg,var(--bg-surface-hover) 25%, var(--border) 37%, var(--bg-surface-hover) 63%); background-size:400% 100%; animation:skel-anim 1.4s ease infinite; border-radius:6px;}
@keyframes skel-anim{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

/* AI insight card */
.ai-panel-card{border-color:var(--accent-border); background:linear-gradient(180deg, var(--accent-wash) 0%, var(--bg-surface) 140px);}
.ai-inline-btn{height:22px; padding:0 8px; font-size:0.68rem; gap:4px; color:var(--accent); border-color:transparent; background:transparent;}
.ai-inline-btn:hover{background:var(--accent-wash);}
.ai-image-box{border:1px dashed var(--accent-border); border-radius:var(--radius-md); padding:11px; background:var(--bg-surface);}
.ai-image-preview{width:52px; height:52px; border-radius:8px; background:var(--bg-surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; color:var(--ink-muted);}
.ai-image-preview img{width:100%; height:100%; object-fit:cover;}
@keyframes ai-field-flash{ 0%{ box-shadow:0 0 0 3px var(--accent-wash-strong); } 100%{ box-shadow:0 0 0 0 rgba(0,0,0,0); } }
.ai-flash{ animation:ai-field-flash 1.1s ease-out; border-color:var(--accent) !important; }
.ai-hero{background:linear-gradient(100deg, var(--accent-wash) 0%, rgba(144,133,233,0.10) 100%); border-color:var(--accent-border);}
.ai-hero-stat{flex:1; min-width:120px; padding:6px 18px; border-right:1px solid var(--border);}
.ai-hero-stat:last-child{border-right:none;}
.ai-hero-stat .n{font-family:var(--font-display); font-size:1.5rem; font-weight:800;}
.ai-hero-stat .l{font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-muted); margin-top:2px;}
.ai-insight{border:1px solid var(--border); border-radius:var(--radius-lg); padding:13px 14px; background:var(--bg-surface); display:flex; flex-direction:column; gap:8px;}
.ai-insight-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.ai-insight-title{font-size:0.85rem; font-weight:700; line-height:1.4;}
.ai-insight-meta{font-size:0.76rem; color:var(--ink-secondary);}
.ai-insight-actions{display:flex; gap:7px; margin-top:2px; flex-wrap:wrap; align-items:center;}
.why-link{font-size:0.72rem; color:var(--ink-muted); cursor:pointer; text-decoration:underline; text-underline-offset:2px; margin-left:auto;}
.why-link:hover{color:var(--accent);}
.why-box{font-size:0.75rem; color:var(--ink-secondary); background:var(--bg-surface-2); border:1px solid var(--border); border-radius:7px; padding:9px 10px; display:none;}
.why-box.show{display:block;}

/* Ops tiles */
.ops-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
.ops-tile{border:1px solid var(--border); border-radius:var(--radius-md); padding:11px 12px; background:var(--bg-surface); cursor:pointer;}
.ops-tile:hover{border-color:var(--border-strong); background:var(--bg-surface-hover);}
.ops-tile .n{font-family:var(--font-display); font-size:1.28rem; font-weight:800;}
.ops-tile .l{font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.045em; color:var(--ink-muted); margin-top:3px;}
.ops-tile.bar{height:3px; border-radius:3px; margin-top:8px;}

/* Chart */
.chart-toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
.seg{display:flex; border:1px solid var(--border); border-radius:7px; overflow:hidden;}
.seg button{border:none; background:var(--bg-surface); color:var(--ink-secondary); font-size:0.75rem; font-weight:600; padding:6px 11px; cursor:pointer; border-right:1px solid var(--border);}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--accent); color:#fff;}
.chart-legend{display:flex; align-items:center; gap:14px; font-size:0.75rem; color:var(--ink-secondary); margin-bottom:4px;}
.chart-legend .li{display:flex; align-items:center; gap:6px;}
.chart-legend .sw{width:9px;height:9px;border-radius:2px;}
.chart-box{position:relative;}
.chart-tooltip{position:absolute; pointer-events:none; background:var(--ink-primary); color:var(--bg-surface); font-size:0.72rem; padding:6px 9px; border-radius:6px; box-shadow:var(--shadow-md); white-space:nowrap; opacity:0; transform:translate(-50%,-100%); transition:opacity .08s; z-index:5; font-family:var(--font-mono);}
.chart-tooltip.show{opacity:1;}
.barlist{display:flex; flex-direction:column; gap:9px;}
.barlist .row{display:grid; grid-template-columns:104px 1fr 66px; align-items:center; gap:9px; font-size:0.78rem;}
.barlist .row .name{color:var(--ink-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.barlist .track{height:8px; background:var(--bg-surface-2); border-radius:4px; overflow:hidden;}
.barlist .fill{height:100%; border-radius:4px;}
.barlist .val{text-align:right; font-family:var(--font-mono); font-weight:600; font-variant-numeric:tabular-nums;}

/* Timeline */
.timeline{list-style:none; margin:0; padding:0; position:relative;}
.timeline li{position:relative; padding:0 0 20px 26px;}
.timeline li::before{content:''; position:absolute; left:6px; top:2px; width:9px; height:9px; border-radius:50%; background:var(--accent); border:2px solid var(--bg-surface); box-shadow:0 0 0 1px var(--accent);}
.timeline li::after{content:''; position:absolute; left:10px; top:12px; bottom:-6px; width:1px; background:var(--border);}
.timeline li:last-child::after{display:none;}
.timeline li.pending::before{background:var(--bg-surface); box-shadow:0 0 0 1px var(--border-strong);}
.timeline .tl-title{font-size:0.82rem; font-weight:700;}
.timeline .tl-meta{font-size:0.73rem; color:var(--ink-muted); margin-top:2px;}
.timeline li.pending .tl-title{color:var(--ink-muted); font-weight:600;}

/* status stepper */
.stepper{display:flex; align-items:center; width:100%; margin:6px 0 4px;}
.step{display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; position:relative;}
.step .dot{width:20px;height:20px;border-radius:50%;background:var(--bg-surface-2);border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;z-index:1;}
.step.done .dot{background:var(--accent); border-color:var(--accent);}
.step.done .dot svg{width:11px;height:11px;color:#fff;}
.step.current .dot{border-color:var(--accent); background:var(--bg-surface); box-shadow:0 0 0 3px var(--accent-wash);}
.step .lbl{font-size:0.68rem; font-weight:600; color:var(--ink-muted); text-align:center;}
.step.done .lbl, .step.current .lbl{color:var(--ink-primary);}
.step::before{content:''; position:absolute; top:9px; left:calc(-50% + 10px); right:calc(50% + 10px); height:2px; background:var(--border-strong); z-index:0;}
.step:first-child::before{display:none;}
.step.done::before{background:var(--accent);}

/* Modals / overlays */
.overlay-scrim{position:fixed; inset:0; background:rgba(8,9,12,0.5); z-index:100; display:none; backdrop-filter: blur(1px);}
.overlay-scrim.show{display:block;}
.panel-right{position:fixed; top:0; right:0; bottom:0; width:min(420px,92vw); background:var(--bg-surface); z-index:101; box-shadow:var(--shadow-lg); transform:translateX(100%); transition:transform .18s ease; display:flex; flex-direction:column; border-left:1px solid var(--border);}
.panel-right.show{transform:translateX(0);}
.panel-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); flex-shrink:0;}
.panel-body{flex:1; overflow-y:auto; padding:14px 16px;}

.modal-center{position:fixed; top:10vh; left:50%; transform:translateX(-50%); width:min(600px,92vw); background:var(--bg-surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); z-index:101; display:none; flex-direction:column; max-height:78vh; border:1px solid var(--border);}
.modal-center.show{display:flex;}
.cmdk-input-row{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--border);}
.cmdk-input-row svg{width:16px;height:16px; color:var(--ink-muted);}
#cmdk-input{flex:1; border:none; outline:none; background:none; font-size:0.95rem; color:var(--ink-primary); font-family:inherit;}
.cmdk-list{overflow-y:auto; padding:7px;}
.cmdk-group-label{font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-muted); padding:9px 10px 4px;}
.cmdk-item{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:7px; cursor:pointer; font-size:0.83rem;}
.cmdk-item svg{width:15px;height:15px; color:var(--ink-muted); flex-shrink:0;}
.cmdk-item:hover, .cmdk-item.sel{background:var(--accent-wash);}
.cmdk-item .meta{margin-left:auto; font-size:0.7rem; color:var(--ink-muted); font-family:var(--font-mono);}

.confirm-modal{position:fixed; top:0; left:0; right:0; bottom:0; z-index:110; display:none; align-items:center; justify-content:center;}

.confirm-card{width:min(380px,90vw); background:var(--bg-surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); border:1px solid var(--border); padding:18px;}

/* Toasts */
#toast-stack{position:fixed; bottom:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
.toast{display:flex; align-items:center; gap:9px; background:var(--ink-primary); color:var(--bg-surface); padding:10px 14px; border-radius:8px; font-size:0.8rem; font-weight:600; box-shadow:var(--shadow-lg); animation:toast-in .16s ease;}
.toast svg{width:15px;height:15px; color:var(--status-good); flex-shrink:0;}
@keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* AI assistant panel */
.chat-msg{display:flex; gap:9px; margin-bottom:14px; align-items:flex-start;}
.chat-msg .av{width:24px;height:24px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;}
.chat-msg.bot .av{background:linear-gradient(155deg,var(--accent),#4a3aa7);}
.chat-msg.user .av{background:var(--ink-muted);}
.chat-msg .bubble{font-size:0.82rem; line-height:1.55; background:var(--bg-surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 11px; flex:1;}
.chat-msg.user .bubble{background:var(--accent-wash);}
.chat-suggest{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0;}
.chat-suggest button{font-size:0.73rem; padding:6px 10px; border-radius:20px; border:1px solid var(--border); background:var(--bg-surface); cursor:pointer; color:var(--ink-secondary);}
.chat-suggest button:hover{border-color:var(--accent-border); color:var(--accent);}

/* misc */
.section-title{font-size:0.98rem; font-weight:800; font-family:var(--font-display); margin-bottom:2px;}
.section-sub{font-size:0.78rem; color:var(--ink-muted); margin-bottom:12px;}
.divider{height:1px; background:var(--border); margin:16px 0;}
.pill-list{display:flex; gap:6px; flex-wrap:wrap;}
.field{display:flex; flex-direction:column; gap:5px;}
.field label{font-size:0.72rem; font-weight:700; color:var(--ink-secondary); text-transform:uppercase; letter-spacing:0.03em;}
.field input, .field select, .field textarea{height:33px; border:1px solid var(--border); border-radius:7px; padding:0 10px; font-size:0.82rem; background:var(--bg-surface); color:var(--ink-primary); font-family:inherit;}
.field textarea{height:auto; padding:8px 10px;}
.tree{list-style:none; margin:0; padding:0;}
.tree-node{padding:2px 0;}
.tree-row{display:flex; align-items:center; gap:7px; padding:7px 8px; border-radius:7px; cursor:pointer;}
.tree-row:hover{background:var(--bg-surface-hover);}
.tree-children{margin-left:20px; border-left:1px solid var(--border); padding-left:6px;}
.progress-track{height:6px; border-radius:3px; background:var(--bg-surface-2); overflow:hidden;}
.progress-fill{height:100%; border-radius:3px;}

@media (max-width: 980px){

/* ---------------------------- SEED / RNG ---------------------------- */
let _seed = 88172645;
function rnd(){ _seed ^= _seed << 13; _seed ^= _seed >>> 17; _seed ^= _seed << 5; return ((_seed >>> 0) % 100000) / 100000; }
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function randInt(a,b){ return a + Math.floor(rnd()*(b-a+1)); }
function uid(prefix){ return prefix + Math.floor(rnd()*900000+100000); }

/* ---------------------------- DATE HELPERS ---------------------------- */
const TODAY = new Date(2026,7,24); // 24 Aug 2026
function daysAgo(n){ const d = new Date(TODAY); d.setDate(d.getDate()-n); return d; }
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d){ return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear(); }
function fmtDateTime(d){ let h=d.getHours(), m=d.getMinutes(); let ap = h>=12?'PM':'AM'; let h12 = h%12||12; return fmtDate(d)+', '+h12+':'+String(m).padStart(2,'0')+' '+ap; }
function relTime(d){
  const diff = Math.round((TODAY - d)/(1000*60*60*24));
  if(diff<=0) return 'Today';
  if(diff===1) return 'Yesterday';
  if(diff<7) return diff+' days ago';
  if(diff<30) return Math.floor(diff/7)+'w ago';
  return Math.floor(diff/30)+'mo ago';
}

/* ---------------------------- FORMATTERS ---------------------------- */
function fmtINR(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }
function fmtINR2(n){ return '₹' + n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtCompact(n){
  const sign = n<0?'-':''; n=Math.abs(n);
  if(n>=1e7) return sign+'₹'+(n/1e7).toFixed(2)+'Cr';
  if(n>=1e5) return sign+'₹'+(n/1e5).toFixed(2)+'L';
  if(n>=1000) return sign+'₹'+(n/1000).toFixed(1)+'K';
  return sign+'₹'+Math.round(n);
}
function fmtCompactM(n){ // spec-style M/K abbreviation used on hero KPIs
  const sign = n<0?'-':''; n=Math.abs(n);
  if(n>=1e6) return sign+'₹'+(n/1e6).toFixed(1)+'M';
  if(n>=1e3) return sign+'₹'+(n/1e3).toFixed(1)+'K';
  return sign+'₹'+Math.round(n);
}
function fmtNum(n){ return Math.round(n).toLocaleString('en-IN'); }
function fmtPct(n,dp){ dp = dp===undefined?1:dp; return (n>0?'+':'') + n.toFixed(dp) + '%'; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(s){ return s.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function hashColor(s){ const cats=['var(--cat-1)','var(--cat-2)','var(--cat-3)','var(--cat-4)','var(--cat-5)','var(--cat-6)','var(--cat-7)','var(--cat-8)']; let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return cats[h%cats.length]; }

function buildVariants(sku,catId,price,cost){
  const isFootwear = catId.startsWith('cat-run')||catId.startsWith('cat-sneak')||catId.startsWith('cat-sand')||catId.startsWith('cat-form');
  const isApparel = catId.includes('shirt')||catId.includes('tshirt')||catId.includes('dress')||catId.includes('top')||catId.includes('jean');
  let sizes = [];
  if(isFootwear) sizes=['UK6','UK7','UK8','UK9','UK10'];
  else if(isApparel) sizes=['S','M','L','XL'];
  else sizes=['Standard'];
  const colors = isFootwear||isApparel ? ['Black','Navy'] : ['Default'];
  const out=[];
  let vi=1;
  colors.forEach(c=>sizes.forEach(s=>{
    out.push({sku:sku+'-'+s.replace('UK','')+(c!=='Default'&&c!=='Standard'?'-'+c[0]:''), size:s, color:c, barcode:'89012'+randInt(100000,999999),
      price, cost, onHand: randInt(4,80), weight:(0.2+rnd()*1.2).toFixed(2)+'kg', dims: randInt(20,34)+'×'+randInt(14,26)+'×'+randInt(6,14)+' cm'});
    vi++;
  }));
  return out;
}

function weightedStatus(){
  const r = rnd();
  if(r<0.06) return 'Pending'; if(r<0.11) return 'Confirmed'; if(r<0.17) return 'Processing';
  if(r<0.28) return 'Ready to Fulfill'; if(r<0.32) return 'Partially Fulfilled';
  if(r<0.40) return 'Fulfilled'; if(r<0.55) return 'Shipped'; if(r<0.86) return 'Delivered';
  if(r<0.91) return 'Cancelled'; if(r<0.96) return 'Returned'; return 'Refunded';
}

function genSeries(n, base, vol, trendPct){
  const out=[]; let v=base;
  for(let i=0;i<n;i++){
    const trend = base*(trendPct/100)*(i/n);
    v = base + trend + (rnd()-0.5)*vol*2;
    out.push(Math.max(0,Math.round(v)));
  }
  return out;
}

function sparkline(data, w, h, colorVar){
  w=w||58; h=h||24; colorVar=colorVar||'var(--accent)';
  const min=Math.min(...data), max=Math.max(...data); const range=(max-min)||1;
  const pts = data.map((v,i)=>[i/(data.length-1)*w, h - ((v-min)/range)*(h-4) - 2]);
  const line = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ' L'+w+','+h+' L0,'+h+' Z';
  const last = pts[pts.length-1];
  return '<svg class="kpi-spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'
    + '<path d="'+area+'" fill="'+colorVar+'" opacity="0.12" stroke="none"/>'
    + '<path d="'+line+'" fill="none" stroke="'+colorVar+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'
    + '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.1" fill="'+colorVar+'" stroke="var(--bg-surface)" stroke-width="1.4"/>'
    + '</svg>';
}

// Generic data table. cols: [{key,label,align,render(row)}]
function dataTable(opts){
  const {cols, rows, selectable, rowClick, emptyTitle, emptyDesc, tableId} = opts;
  if(!rows.length) return emptyState(emptyTitle||'No records', emptyDesc||'Try adjusting your filters.', 'search');
  let html = '<div class="table-wrap"><table class="dtable" id="'+(tableId||'')+'"><thead><tr>';
  if(selectable) html += '<th style="width:34px;"><input type="checkbox" class="chk" data-select-all></th>';
  cols.forEach(c=>{ html += '<th class="'+(c.align==='right'?'num':'')+'">'+esc(c.label)+'</th>'; });
  html += '</tr></thead><tbody>';
  rows.forEach((row,i)=>{
    html += '<tr data-row-idx="'+i+'"'+(rowClick?' data-clickable="1"':'')+'>';
    if(selectable) html += '<td onclick="event.stopPropagation()"><input type="checkbox" class="chk row-chk" data-row-idx="'+i+'"></td>';
    cols.forEach(c=>{
      const val = c.render ? c.render(row,i) : esc(row[c.key]);
      html += '<td class="'+(c.align==='right'?'num':'')+'">'+val+'</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

    const share = opts.showShare ? ' <span style="color:var(--ink-muted);">('+((it.value/opts.total)*100).toFixed(0)+'%)</span>' : '';

      +'<div class="val">'+(opts.fmt?opts.fmt(it.value):fmtCompact(it.value))+share+'</div></div>';
  }).join('')+'</div>';
}

/* ---- Interactive line/area/bar chart with crosshair tooltip ---- */
function renderChart(containerId, series, opts){
  // series: [{name, data:[{x,y}], color}]
  opts = opts||{}; const type = opts.type||'area'; const w = opts.width||760, h = opts.height||260;
  const pad = {l:44,r:14,t:14,b:24};
  const allY = series.flatMap(s=>s.data.map(d=>d.y));
  let maxY = Math.max(...allY,1), minY = Math.min(0,...allY);
  maxY = maxY*1.12;
  const n = series[0].data.length;
  const xAt = i => pad.l + (i/(n-1||1))*(w-pad.l-pad.r);
  const yAt = v => (h-pad.b) - ((v-minY)/((maxY-minY)||1))*(h-pad.t-pad.b);
  const ySteps = 4;
  let gridSvg = '';
  for(let i=0;i<=ySteps;i++){
    const val = minY + (maxY-minY)*(i/ySteps);
    const y = yAt(val);
    gridSvg += '<line x1="'+pad.l+'" y1="'+y.toFixed(1)+'" x2="'+(w-pad.r)+'" y2="'+y.toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>';
    gridSvg += '<text x="'+(pad.l-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--ink-muted)" font-family="IBM Plex Mono, monospace">'+(opts.yFmt?opts.yFmt(val):fmtCompact(val))+'</text>';
  }
  let xLabels = '';
  const labelEvery = Math.max(1, Math.ceil(n/7));
  for(let i=0;i<n;i+=labelEvery){
    xLabels += '<text x="'+xAt(i).toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" font-size="10" fill="var(--ink-muted)" font-family="IBM Plex Mono, monospace">'+esc(series[0].data[i].x)+'</text>';
  }
  let marksSvg = '';
  series.forEach((s,si)=>{
    const color = s.color || 'var(--cat-'+((si%8)+1)+')';
    if(type==='bar'){
      const bw = Math.min(22, (w-pad.l-pad.r)/n * 0.55 / series.length);
      s.data.forEach((d,i)=>{
        const bx = xAt(i) - bw*series.length/2 + bw*si;
        const by = yAt(d.y);
        marksSvg += '<rect class="mark-bar" data-si="'+si+'" data-i="'+i+'" x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,(h-pad.b-by)).toFixed(1)+'" rx="3" fill="'+color+'"/>';
      });
    } else {
      const pts = s.data.map((d,i)=>[xAt(i),yAt(d.y)]);
      const line = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
      if(type==='area'){
        const area = line+' L'+pts[pts.length-1][0].toFixed(1)+','+(h-pad.b)+' L'+pts[0][0].toFixed(1)+','+(h-pad.b)+' Z';
        marksSvg += '<path d="'+area+'" fill="'+color+'" opacity="0.10" stroke="none"/>';
      }
      marksSvg += '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
      const endp = pts[pts.length-1];
      marksSvg += '<circle cx="'+endp[0].toFixed(1)+'" cy="'+endp[1].toFixed(1)+'" r="4" fill="'+color+'" stroke="var(--bg-surface)" stroke-width="2"/>';
    }
  });
  const legend = series.length>1 ? '<div class="chart-legend">'+series.map((s,si)=>'<div class="li"><span class="sw" style="background:'+(s.color||'var(--cat-'+((si%8)+1)+')')+';"></span>'+esc(s.name)+'</div>').join('')+'</div>' : '';
  const html = legend
    + '<div class="chart-box" id="'+containerId+'" data-w="'+w+'" data-h="'+h+'" data-padl="'+pad.l+'" data-padr="'+pad.r+'" data-padt="'+pad.t+'" data-padb="'+pad.b+'">'
    + '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block;" preserveAspectRatio="none">'
    + gridSvg + marksSvg + xLabels
    + '<line class="crosshair" x1="0" y1="'+pad.t+'" x2="0" y2="'+(h-pad.b)+'" stroke="var(--ink-muted)" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>'
    + '</svg><div class="chart-tooltip" id="'+containerId+'-tt"></div></div>';
  requestAnimationFrame(()=>attachChartHover(containerId, series, type, opts));
  return html;
}
function attachChartHover(containerId, series, type, opts){
  const box = document.getElementById(containerId); if(!box) return;
  const svg = box.querySelector('svg'); const tt = document.getElementById(containerId+'-tt');
  const crosshair = svg.querySelector('.crosshair');
  const w = +box.dataset.w, padl = +box.dataset.padl, padr = +box.dataset.padr;
  const n = series[0].data.length;
  box.addEventListener('mousemove', e=>{
    const rect = svg.getBoundingClientRect();
    const relX = (e.clientX-rect.left)/rect.width*w;
    let i = Math.round((relX-padl)/((w-padl-padr)/(n-1||1)));
    i = Math.max(0,Math.min(n-1,i));
    const xAt = padl + (i/(n-1||1))*(w-padl-padr);
    crosshair.setAttribute('x1',xAt); crosshair.setAttribute('x2',xAt); crosshair.setAttribute('opacity','0.6');
    let lines = '<div style="font-weight:700;margin-bottom:3px;">'+esc(series[0].data[i].x)+'</div>';
    series.forEach(s=>{ lines += '<div>'+esc(s.name)+': <b>'+(opts.yFmt?opts.yFmt(s.data[i].y):fmtCompact(s.data[i].y))+'</b></div>'; });
    tt.innerHTML = lines; tt.classList.add('show');
    const boxRect = box.getBoundingClientRect();
    let leftPx = (e.clientX-boxRect.left); leftPx = Math.max(50,Math.min(boxRect.width-50,leftPx));
    tt.style.left = leftPx+'px'; tt.style.top = (e.clientY-boxRect.top-10)+'px';
  });
  box.addEventListener('mouseleave', ()=>{ crosshair.setAttribute('opacity','0'); tt.classList.remove('show'); });
}

function catTopParent(catId){
  for(const top of CATEGORY_TREE){ if(top.id===catId) return top.name; if(top.children && top.children.find(c=>c.id===catId)) return top.name; if(top.children) for(const mid of top.children){ if(mid.children && mid.children.find(c=>c.id===catId)) return top.name; } }

}

/* ---- Image analysis (real canvas pixel sampling + heuristic category match) ---- */
function nearestColorName(rgb){
  let best=null, bestD=Infinity;
  IMAGE_COLOR_PALETTE.forEach(c=>{
    const d = Math.pow(c.rgb[0]-rgb[0],2)+Math.pow(c.rgb[1]-rgb[1],2)+Math.pow(c.rgb[2]-rgb[2],2);
    if(d<bestD){ bestD=d; best=c.name; }
  });
  return best;
}
function sampleAverageColor(imgEl){
  try{
    const canvas = document.createElement('canvas');
    const w = canvas.width = 40, h = canvas.height = 40;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgEl, 0, 0, w, h);
    const data = ctx.getImageData(0,0,w,h).data;
    let r=0,g=0,b=0,n=0;
    for(let i=0;i<data.length;i+=4){ r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++; }
    return [Math.round(r/n), Math.round(g/n), Math.round(b/n)];
  } catch(e){ return [128,128,128]; }
}
function detectCategoryFromFilename(filename, fallbackCatId){
  const f = (filename||'').toLowerCase();
  for(const entry of IMAGE_CATEGORY_KEYWORDS){ if(entry.kw.some(k=>f.includes(k))) return entry.cat; }
  return fallbackCatId;
}
function aiGenerateFromImage(p, filename, imgEl){
  const rgb = sampleAverageColor(imgEl);
  const colorName = nearestColorName(rgb);
  const catId = detectCategoryFromFilename(filename, p.category);
  const brand = catTopParent(catId)===catTopParent(p.category) ? p.brand : (CATEGORY_BRAND[catTopParent(catId)] || p.brand);
  const virtualP = {...p, category:catId, brand};
  return {
    catId, colorName, rgb,
    title: aiGenerateTitle(virtualP, colorName),
    description: aiGenerateDescription(virtualP, colorName),
    tags: [...new Set(aiGenerateTags(virtualP).concat([colorName]))],
    seoTitle: aiGenerateSeoTitle({...virtualP, name:aiGenerateTitle(virtualP, colorName)}),
    metaDescription: aiGenerateMetaDescription({...virtualP, name:aiGenerateTitle(virtualP, colorName)}),
    brand,
  };
}

function renderDashChart(metric, type){
  const conf = METRIC_CONF[metric];
  const cur = genSeries(30, conf.base, conf.vol, 20).map((v,i)=>({x:DAY_LABELS[i], y:v}));
  const prev = genSeries(30, conf.base*0.85, conf.vol*0.9, 12).map((v,i)=>({x:DAY_LABELS[i], y:v}));
  document.getElementById('dash-chart-mount').innerHTML = renderChart('dash-chart', [
    {name:'This period', data:cur, color:'var(--cat-1)'},

function wireCommonHandlers(){

    if(el.closest('#sb-nav')) return; // sidebar handled separately
    el.addEventListener('click', ()=>navigate(el.dataset.nav));
  });

  document.querySelectorAll('[data-product]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); navigate('products',{id:el.dataset.product}); }));

  document.querySelectorAll('tr[data-clickable]').forEach(tr=>{
    tr.addEventListener('click', ()=>{ const idx=+tr.dataset.rowIdx; if(tr._rowHandler) tr._rowHandler(idx); });
  });
  document.querySelectorAll('[data-why]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    const box = document.getElementById('why-'+el.dataset.why);
    if(box) box.classList.toggle('show');
  }));
  document.querySelectorAll('[data-insight-cta]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    const ins = AI_INSIGHTS.find(i=>i.id===el.dataset.insightCta);

    if(cta.action==='newPO'){

        PURCHASE_ORDERS.unshift({id:'po-new-'+Date.now(), number:'PO-'+(20260+PURCHASE_ORDERS.length), supplier:'Stride Manufacturing Co.', supplierId:'sup-1',

}

  if(selAll) selAll.addEventListener('change', e=>{ mount.querySelectorAll('.row-chk').forEach(c=>c.checked=e.target.checked); mount.querySelector('.row-chk').dispatchEvent(new Event('change')); });
}

  const p = PRODUCTS.find(x=>x.id===id) || PRODUCTS[0];

  const tab = APP.tabs['product-detail'];
  document.getElementById('view-root').innerHTML = `
    ${breadcrumb([{label:'Commerce'},{label:'Products',route:'products'},{label:p.name}])}
    <div class="page-head">
      <div style="display:flex;gap:12px;align-items:flex-start;">
        ${p.imageDataUrl ? '<img src="'+p.imageDataUrl+'" style="width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid var(--border);" alt="">' : '<div class="swatch" style="width:44px;height:44px;font-size:0.85rem;background:'+hashColor(p.sku)+';">'+initials(p.name)+'</div>'}
        <div><div class="page-title">${esc(p.name)}</div><div class="page-sub mono">SKU ${p.sku} · Product ID ${p.id} ${badge(p.status)} ${p.tags.includes('ai-generated')?badge('accent','AI Generated'):''}</div></div>
      </div>
      <div class="page-actions">
        <button class="btn"><span>${icon('eye',14)}</span>Preview</button>

    </div>

function setCategoryTab(t, el){ APP.tabs['categories']=t; document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.remove('active')); if(el) el.classList.add('active'); renderCategoryTab(t); }
function renderCategoryTab(tab){
  const mount = document.getElementById('cat-tab-mount');
  if(tab==='collections'){
    const collections = [
      {name:'New Arrivals', products:34, visibility:'Visible'}, {name:'Best Sellers', products:52, visibility:'Visible'},
      {name:'Festive Edit', products:28, visibility:'Visible'}, {name:'Clearance', products:19, visibility:'Hidden'},
      {name:'Under ₹999', products:41, visibility:'Visible'},
    ];
    mount.innerHTML = `<div class="card"><div class="card-body pad-0">${dataTable({rows:collections, cols:[
      {key:'name',label:'Collection'},{key:'products',label:'Products',align:'right'},{key:'visibility',label:'Visibility', render:c=>badge(c.visibility==='Visible'?'Active':'Draft',c.visibility)},
    ]})}</div></div>`;
    return;
  }
  function nodeCount(node){
    if(!node.children) return PRODUCTS.filter(p=>p.category===node.id).length;
    return node.children.reduce((a,c)=>a+nodeCount(c),0);
  }
  function renderNode(node, depth){
    const count = nodeCount(node);
    let html = '<li class="tree-node"><div class="tree-row" style="padding-left:'+(depth*4)+'px;">'
      + (node.children? icon('chevronDown',13) : '<span style="width:13px;display:inline-block;"></span>')
      + '<div class="swatch" style="width:22px;height:22px;font-size:0.5rem;background:'+hashColor(node.id)+';">'+initials(node.name)+'</div>'
      + '<span class="cell-primary" style="flex:1;">'+esc(node.name)+'</span>'
      + '<span class="cell-muted" style="font-size:0.75rem;">'+count+' products</span>'
      + badge('Active','Visible')
      + '</div>';
    if(node.children) html += '<ul class="tree-children">'+node.children.map(c=>renderNode(c,0)).join('')+'</ul>';
    html += '</li>';
    return html;
  }
  mount.innerHTML = '<div class="card"><div class="card-body"><ul class="tree">'+CATEGORY_TREE.map(n=>renderNode(n,0)).join('')+'</ul></div></div>';
}

function renderInvLevels(){
  const st = PAGE_STATE.invLevels;
  let rows = PRODUCTS.map(p=>({p, wh: st.wh==='all'?null:st.wh}));
  let flat = [];
  PRODUCTS.forEach(p=>{
    WAREHOUSES.filter(w=>w.type==='Fulfillment Center').forEach(w=>{
      if(st.wh!=='all' && st.wh!==w.id) return;
      const onHand = p.invByWh[w.id]||0;
      const reserved = Math.round(onHand*0.08);
      const avail = onHand-reserved;
      const status = avail<=0?'Out of Stock':(avail<=p.reorderPoint?'Low Stock':'In Stock');
      if(st.status!=='all' && st.status!==status) return;
      flat.push({sku:p.sku, product:p.name, wh:w.name, onHand, available:avail, reserved, incoming:p.incoming, damaged:randInt(0,3), reorderPoint:p.reorderPoint, daysOfStock: Math.max(0,Math.round(avail/(Math.max(1,p.sold30/30)))), status});
    });
  });
  const pageSize=14, total=flat.length;
  const pageRows = flat.slice((st.page-1)*pageSize, st.page*pageSize);
  const mount = document.getElementById('inv-levels-mount');
  mount.innerHTML = dataTable({rows:pageRows, cols:[
    {key:'sku',label:'SKU', render:r=>'<span class="mono">'+r.sku+'</span>'}, {key:'product',label:'Product'}, {key:'wh',label:'Warehouse'},
    {key:'onHand',label:'On Hand', align:'right'}, {key:'available',label:'Available', align:'right'}, {key:'reserved',label:'Reserved', align:'right'},
    {key:'incoming',label:'Incoming', align:'right', render:r=>r.incoming||'—'}, {key:'damaged',label:'Damaged', align:'right'},
    {key:'reorderPoint',label:'Reorder Pt', align:'right'}, {key:'daysOfStock',label:'Days of Stock', align:'right'},
    {key:'status',label:'Status', render:r=>badge(r.status)},
  ]}) + (total?pagerHTML('inv',total,st.page,pageSize):'');
  mount.querySelectorAll('[data-pager]').forEach(b=>b.addEventListener('click',()=>{ st.page=+b.dataset.page; renderInvLevels(); }));
}

      ${kpiCard({label:'Issued This Month', value:fmtNum(issuedThisMonth.length), delta:11.2, spark:genSeries(14,issuedThisMonth.length,2,10)})}

    <div class="card"><div class="card-body pad-0" id="gc-table-mount"></div></div>
  `;
  renderGiftCardTable();
  document.getElementById('gc-issue').addEventListener('click', ()=>{
    const cust = pick(CUSTOMERS); const value = pick(GIFT_CARD_VALUES);
    const issued = TODAY; const expiry = new Date(issued); expiry.setFullYear(expiry.getFullYear()+1);

        {key:'sku',label:'SKU', render:p=>'<span class="mono">'+p.sku+'</span>'}, {key:'name',label:'Product', render:p=>'<span class="linktext" data-product="'+p.id+'">'+esc(p.name)+'</span>'},
        {key:'available',label:'Current Stock', align:'right'},
        {key:'velocity',label:'Avg Daily Sales', align:'right', render:p=>p.sku==='RS-102'?42:Math.max(1,Math.round(p.sold30/30))},
        {key:'stockout',label:'Predicted Stockout', align:'right', render:p=>{const days=p.sku==='RS-102'?6:Math.round(p.available/(Math.max(1,p.sold30/30))); return '<span style="color:'+(days<=7?'var(--status-critical-text)':days<=14?'var(--status-warning-text)':'var(--ink-primary)')+';font-weight:700;">'+days+' days</span>';}},
        {key:'reorder',label:'Recommended Reorder', align:'right', render:p=>p.sku==='RS-102'?500:Math.round(p.reorderPoint*2)},
        {key:'confidence',label:'Confidence', align:'right', render:p=>(p.sku==='RS-102'?87:randInt(70,93))+'%'},
        {key:'action',label:'', render:p=>'<button class="btn sm primary" data-nav="purchase-orders">Reorder</button>'},
      ]})}</div></div>`;
    const renderFcChart = (pid)=>{
      const p = PRODUCTS.find(x=>x.id===pid) || risky[0];
      const velocity = p.sku==='RS-102'?42:Math.max(1,Math.round(p.sold30/30));
      const hist = genSeries(14, velocity, velocity*0.25, 6).map((v,i)=>({x:DAY_LABELS[16+i], y:v}));
      const lastActual = hist[hist.length-1].y;
      const proj = genSeries(14, lastActual, velocity*0.2, -8).map((v,i)=>({x:'+'+(i+1)+'d', y:v}));
      document.getElementById('fc-chart-mount').innerHTML = renderChart('fc-trend-chart', [
        {name:'Actual sales/day', data:hist, color:'var(--cat-1)'},
        {name:'AI-projected demand', data:proj, color:'#9085e9'},
      ], {type:'line', yFmt:v=>fmtNum(v)+'/day', width:1140, height:220});
    };
    document.getElementById('fc-sku-select').addEventListener('change', e=>renderFcChart(e.target.value));
    renderFcChart(risky[0].id);
  }
}

/* ============================================================
   AI ASSISTANT (shared logic — used by slide-over panel + full page)
   ============================================================ */
const AI_SUGGESTED_Q = [
  'Why did revenue change this week?',
  'Which products are likely to stock out next week?',
  'Show my most profitable products.',
  'Which customers have not purchased in 90 days?',
  'Why are returns increasing?',
  'Which warehouse is underperforming?',
  'What should I reorder this week?',
  'Which ad channel has the best CAC right now?',
  'Where is my margin compressing?',
];
function aiAnswer(q){
  const s = q.toLowerCase();
  if(s.includes('revenue')){
    return {text:'Revenue is ₹24.8M this period, up 18.4% vs the previous period. The Running Shoes category is the largest contributor, up 31% week-over-week on strong Online Store and Mobile App demand.',
      metrics:['Revenue: ₹24.8M (+18.4%)','Running Shoes: +31% WoW','Returning customers: 44% of orders (+14% MoM)'], action:{label:'View Sales Analytics', route:'analytics-sales'}};
  }
  if(s.includes('stock out')||s.includes('stockout')||s.includes('reorder')){
    return {text:'RS-102 (Men\'s Air Stride Running Shoes) is the highest-risk SKU — 240 units on hand at Delhi Warehouse against 42 units/day average sales, projecting a stockout in 6 days at 87% confidence. Recommended reorder: 500 units from Stride Manufacturing Co.',
      metrics:['Current stock: 240','Avg daily sales: 42/day','Predicted stockout: 6 days','Confidence: 87%'], action:{label:'Create Purchase Order', route:'purchase-orders'}};
  }
  if(s.includes('profitable')){
    const top = [...PRODUCTS].sort((a,b)=>(b.margin*b.revenue30)-(a.margin*a.revenue30)).slice(0,3);
    return {text:'Your most profitable products by absolute gross profit are '+top.map(p=>p.name).join(', ')+', combining high margin with strong sell-through.',
      metrics:top.map(p=>p.name+': '+p.margin.toFixed(0)+'% margin, '+fmtCompact(p.revenue30)+' revenue (30d)'), action:{label:'View Product Analytics', route:'analytics-product'}};
  }
  if(s.includes('90 days')||s.includes('not purchased')||s.includes('inactive')||s.includes('churn')){
    const inactive = CUSTOMERS.filter(c=>(TODAY-c.lastOrder)/864e5>=90);
    return {text:inactive.length+' customers have not purchased in 90+ days, representing '+fmtCompact(inactive.reduce((a,c)=>a+c.revenue,0))+' in historical revenue at risk of churn.',
      metrics:inactive.slice(0,3).map(c=>c.name+' — last order '+relTime(c.lastOrder)), action:{label:'View Customer Analytics', route:'analytics-customer'}};
  }
  if(s.includes('return')){
    return {text:'Return rate for Women\'s Dresses is up 3.1pp month-over-month, with "wrong size" now the leading reason at 41% of dress returns — likely due to missing size-fit guidance on product pages.',
      metrics:['Dress return rate: 11.2% (+3.1pp)','"Wrong size" share: 41%'], action:{label:'View Products', route:'products'}};
  }
  if(s.includes('warehouse')||s.includes('underperform')){
    return {text:'Mumbai Warehouse is underperforming on fulfillment SLA — 8.4% of orders shipped late in the last 7 days vs a 3% network target, driven by an evening-shift staffing gap.',
      metrics:['Mumbai SLA breach rate: 8.4%','Network target: 3%','27 delayed orders this week'], action:{label:'View Fulfillment', route:'fulfillment'}};
  }
  if(s.includes('cac')||s.includes('acquisition')||s.includes('ad channel')||s.includes('channel')&&s.includes('best')){
    return {text:'Meta Ads is currently your most cost-efficient acquisition channel — ₹352 CAC vs ₹452 on Google Search, with a comparable 30-day repeat-purchase rate. Shifting incremental budget there looks favorable right now.',
      metrics:['Meta CAC: ₹352','Google CAC: ₹452','30-day repeat rate: 18.4% (Meta) vs 17.9% (Google)'], action:{label:'View Marketing Analytics', route:'analytics-marketing'}};
  }
  if(s.includes('margin')||s.includes('compress')||s.includes('profit')&&s.includes('where')){
    return {text:'Electronics is where margin is compressing fastest — down 4.6pp month-over-month to 41.2%, driven by discounting on Wireless Earbuds Pro and Smartwatch Lite to match Amazon marketplace pricing.',
      metrics:['Electronics margin: 41.2% (-4.6pp MoM)','Category target: 46%','Amazon price gap: -6.8% vs Online Store'], action:{label:'View Financial Analytics', route:'analytics-financial'}};
  }
  return {text:'Based on your current dashboard data: revenue is ₹24.8M (+18.4%), 27 orders are delayed at Mumbai Warehouse, and RS-102 is projected to stock out in 6 days. Ask me about revenue, inventory risk, returns, or customers for a deeper breakdown.',
    metrics:['Revenue: ₹24.8M (+18.4%)','Delayed orders: 27','At-risk SKUs: '+LOW_STOCK.length], action:{label:'Open AI Insights', route:'ai-insights'}};
}
function chatBubbleHTML(role, html){
  return '<div class="chat-msg '+role+'"><div class="av">'+(role==='bot'?icon('sparkle',13):icon('user',13))+'</div><div class="bubble">'+html+'</div></div>';
}
function aiAnswerHTML(q){
  const a = aiAnswer(q);
  return chatBubbleHTML('user', esc(q)) + chatBubbleHTML('bot',
    esc(a.text) + '<div style="margin-top:8px;display:flex;flex-direction:column;gap:3px;">'
    + a.metrics.map(m=>'<div style="font-size:0.72rem;color:var(--ink-secondary);" class="mono">• '+esc(m)+'</div>').join('')
    + '</div><button class="btn sm primary" style="margin-top:9px;" data-nav="'+a.action.route+'">'+esc(a.action.label)+'</button>');
}

  const body = document.getElementById('ai-chat-body');

  document.getElementById('view-root').innerHTML = `
    ${breadcrumb([{label:'AI'},{label:'AI Assistant'}])}
    <div class="page-head"><div><div class="page-title">${icon('bot',20)} AI Assistant</div><div class="page-sub">Ask questions about your business in plain language — answers are grounded in this dashboard's data</div></div></div>
    <div class="grid" style="grid-template-columns:2fr 1fr;">
      <div class="card" style="display:flex;flex-direction:column;height:560px;">
        <div class="card-body" id="ai-page-chat-body" style="flex:1;overflow-y:auto;"></div>
        <div style="border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:8px;">
          <input id="ai-page-input" placeholder="Ask about your business…" style="flex:1;height:38px;border:1px solid var(--border);border-radius:8px;padding:0 12px;font-size:0.85rem;background:var(--bg-surface-2);color:var(--ink-primary);font-family:inherit;">
          <button class="btn primary" id="ai-page-send">Send</button>
        </div>
      </div>
      <div class="card"><div class="card-head"><div class="card-title">Try asking</div></div><div class="card-body" style="display:flex;flex-direction:column;gap:7px;">
        ${AI_SUGGESTED_Q.map(q=>'<button class="btn sm" style="justify-content:flex-start;" data-page-suggest="'+esc(q)+'">'+esc(q)+'</button>').join('')}
      </div></div>
    </div>
  `;
  const body = document.getElementById('ai-page-chat-body');
  body.innerHTML = chatBubbleHTML('bot','Hi! Ask me anything about revenue, inventory, returns, customers or fulfillment — I\'ll answer using this dashboard\'s live data.');
  const ask = q=>{ body.insertAdjacentHTML('beforeend', aiAnswerHTML(q)); wirePageAi(); body.scrollTop = body.scrollHeight; };
  function wirePageAi(){
    document.querySelectorAll('[data-page-suggest]').forEach(b=>b.onclick=()=>ask(b.dataset.pageSuggest));
    body.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click', ()=>navigate(b.dataset.nav)));
  }
  document.getElementById('ai-page-send').addEventListener('click', ()=>{ const inp=document.getElementById('ai-page-input'); if(!inp.value.trim())return; ask(inp.value.trim()); inp.value=''; });
  document.getElementById('ai-page-input').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('ai-page-send').click(); });
  wirePageAi();
  wireCommonHandlers();
}

function closeAllPanels(){

function renderNotifPanel(){

    <div style="display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);${n.read?'':'background:var(--accent-wash);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px;'}">

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
function cmdkItems(query){
  const q = (query||'').toLowerCase();
  const items = [];
  if(!q){
    items.push({group:'Quick Actions', icon:'plus', label:'Create Order', action:()=>navigate('orders')});
    items.push({group:'Quick Actions', icon:'plus', label:'Add Product', action:()=>navigate('products')});
    items.push({group:'Quick Actions', icon:'sparkle', label:'Ask AI Assistant', action:()=>{ closeAllPanels(); document.getElementById('ai-panel').classList.add('show'); document.getElementById('scrim').classList.add('show'); }});
    items.push({group:'Navigate', icon:'grid', label:'Dashboard', action:()=>navigate('dashboard')});
    items.push({group:'Navigate', icon:'cart', label:'Orders', action:()=>navigate('orders')});
    items.push({group:'Navigate', icon:'box', label:'Products', action:()=>navigate('products')});
    items.push({group:'Navigate', icon:'stack', label:'Inventory', action:()=>navigate('inventory')});
    items.push({group:'Navigate', icon:'sparkle', label:'AI Insights', action:()=>navigate('ai-insights')});
    return items;
  }
  ORDERS.filter(o=>o.number.toLowerCase().includes(q)||o.customerName.toLowerCase().includes(q)||o.customerEmail.toLowerCase().includes(q)||o.tracking.toLowerCase().includes(q)).slice(0,5).forEach(o=>{
    items.push({group:'Orders', icon:'cart', label:o.number+' — '+o.customerName, meta:fmtINR(o.total)+' · '+o.status, action:()=>navigate('orders',{id:o.id})});
  });
  PRODUCTS.filter(p=>p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)).slice(0,5).forEach(p=>{
    items.push({group:'Products', icon:'box', label:p.name, meta:p.sku, action:()=>navigate('products',{id:p.id})});
  });
  CUSTOMERS.filter(c=>c.name.toLowerCase().includes(q)||c.email.toLowerCase().includes(q)||c.phone.includes(q)).slice(0,5).forEach(c=>{
    items.push({group:'Customers', icon:'users', label:c.name, meta:c.email, action:()=>openCustomerPanel(c.id)});
  });
  NAV.flatMap(g=>g.items).filter(it=>it.label.toLowerCase().includes(q)).slice(0,5).forEach(it=>{
    items.push({group:'Navigate', icon:it.icon, label:it.label, action:()=>navigate(it.key)});
  });
  if(!items.length) items.push({group:'No results', icon:'search', label:'No matches for "'+query+'"', action:null});
  return items;
}
let cmdkSel = 0;
function renderCmdk(){
  const q = document.getElementById('cmdk-input').value;
  const items = cmdkItems(q);
  cmdkSel = 0;
  const groups = {};
  items.forEach((it,i)=>{ it._i=i; (groups[it.group]=groups[it.group]||[]).push(it); });
  document.getElementById('cmdk-list').innerHTML = Object.keys(groups).map(g=>
    '<div class="cmdk-group-label">'+esc(g)+'</div>' + groups[g].map(it=>
      '<div class="cmdk-item'+(it._i===0?' sel':'')+'" data-cmdk-idx="'+it._i+'">'+icon(it.icon,15)+'<span>'+esc(it.label)+'</span>'+(it.meta?'<span class="meta">'+esc(it.meta)+'</span>':'')+'</div>'
    ).join('')
  ).join('');
  document.getElementById('cmdk-list').querySelectorAll('[data-cmdk-idx]').forEach(el=>{
    el.addEventListener('click', ()=>{ const it=items[+el.dataset.cmdkIdx]; if(it && it.action){ it.action(); closeAllPanels(); } });
    el.addEventListener('mouseenter', ()=>{ cmdkSel=+el.dataset.cmdkIdx; updateCmdkSel(); });
  });
  window._cmdkItems = items;
}
function updateCmdkSel(){
  document.querySelectorAll('.cmdk-item').forEach(el=>el.classList.toggle('sel', +el.dataset.cmdkIdx===cmdkSel));
  const sel = document.querySelector('.cmdk-item.sel'); if(sel) sel.scrollIntoView({block:'nearest'});
}
function openCmdk(){
  closeAllPanels();
  document.getElementById('cmdk').classList.add('show');
  document.getElementById('scrim').classList.add('show');
  document.getElementById('cmdk-input').value='';
  renderCmdk();
  setTimeout(()=>document.getElementById('cmdk-input').focus(),10);
}
document.getElementById('cmdk-input').addEventListener('input', renderCmdk);
document.getElementById('cmdk-input').addEventListener('keydown', e=>{
  const items = window._cmdkItems||[];
  if(e.key==='ArrowDown'){ e.preventDefault(); cmdkSel=Math.min(items.length-1,cmdkSel+1); updateCmdkSel(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); cmdkSel=Math.max(0,cmdkSel-1); updateCmdkSel(); }
  else if(e.key==='Enter'){ const it=items[cmdkSel]; if(it && it.action){ it.action(); closeAllPanels(); } }
  else if(e.key==='Escape'){ closeAllPanels(); }
});

  if(next) root.setAttribute('data-theme', next); else root.removeAttribute('data-theme');
  toast('Theme: '+(next || 'system default'));
});

function parseHash(){
  const raw = (location.hash || '#/dashboard').replace('#/','');
  const parts = raw.split('/').filter(Boolean);
  return {route: parts[0]||'dashboard', id: parts[1]};
}
function router(){
  const {route, id} = parseHash();
  APP.route = route; APP.params = {id};
  const fn = ROUTES[route] || ROUTES['dashboard'];
  document.getElementById('view-root').innerHTML = '<div class="skel" style="height:120px;border-radius:12px;margin-bottom:16px;"></div><div class="skel" style="height:280px;border-radius:12px;"></div>';
  renderSidebar();
  requestAnimationFrame(()=>{ setTimeout(()=>{ fn(id); wireBreadcrumbs(); renderSidebar(); window.scrollTo(0,0); }, 90); });
}
window.addEventListener('hashchange', router);
