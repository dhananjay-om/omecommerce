# Reverse proxy + TLS termination for a SINGLE public domain serving both
# Next.js apps by path: the storefront at the domain root, the admin app at
# /admin (matching apps/admin/next.config.ts's `basePath: '/admin'`). The
# backend API is intentionally NOT exposed here — both apps only ever call
# it server-side over the internal Docker network (see DEPLOYMENT.md "Why
# the API isn't public").
#
# EDIT ME: replace every YOUR_DOMAIN_HERE below with your real domain (must
# match DOMAIN in .env.production) before first deploy.
#
# Unlike Caddy, nginx has no built-in ACME client — deploy/init-certbot.sh
# is a one-time bootstrap script that gets the initial Let's Encrypt
# certificate; after that, the `certbot` service in docker-compose.prod.yml
# renews it automatically on a loop.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_HERE;

    # Let's Encrypt's HTTP-01 challenge — certbot writes the proof file here
    # via the shared certbot_webroot volume, and it must be reachable over
    # plain HTTP (not redirected) for issuance/renewal to succeed.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN_HERE;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # `proxy_pass http://admin:3000;` — deliberately NO trailing path/slash
    # after the port. With one, nginx would strip the /admin prefix this
    # location matched before forwarding (e.g. /admin/login -> /login) —
    # wrong, since the admin app's basePath means it expects to SEE /admin
    # on incoming requests. Without one (as written), nginx forwards the
    # original request URI unchanged, matching what basePath needs.
    #
    # Plain prefix match (not `/admin/`): a bare request for `/admin` (no
    # trailing slash, e.g. someone typing the URL directly) must match too,
    # not fall through to the storefront location below.
    location /admin {
        proxy_pass http://admin:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public media (product images, invoice/packing-slip PDFs) — presigned
    # S3 URLs, signed against this domain (S3_PUBLIC_ENDPOINT in
    # docker-compose.prod.yml) so the browser can fetch/PUT them directly.
    # EDIT ME if you changed S3_BUCKET from the default 'ome-media' — this
    # location must match the bucket name exactly, since forcePathStyle
    # puts it first in the URL path.
    #
    # No trailing slash on proxy_pass (same reasoning as /admin above) AND
    # an explicit Host header (nginx does NOT default to preserving the
    # original one) — both the path and the Host are part of what's
    # cryptographically signed in a presigned S3 URL, so both must reach
    # minio byte-for-byte unchanged or signature validation fails. Verified
    # against a real MinIO + nginx setup before writing this, not assumed.
    location /ome-media/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://storefront:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

