# Alternative to deploy/nginx.conf: use this when an EXISTING host-level
# nginx (already Certbot-managed, outside Docker) should stay the front door
# instead of this project's own Docker `nginx`/`certbot` services.
#
# This is a drop-in REPLACEMENT for the `location /` block (and everything
# else EXCEPT the `listen`/`ssl_certificate*` lines, which a working
# Certbot-managed host config already has correct) in whatever file
# certbot wrote for you, typically
# /etc/nginx/sites-available/<your-domain> — same path-based split as
# deploy/nginx.conf (storefront at the root, admin at /admin — matching
# apps/admin/next.config.ts's basePath), just proxying to 127.0.0.1 instead
# of a Docker network hostname, since the admin/storefront containers
# publish their ports to localhost for exactly this case (see
# docker-compose.prod.yml's `ports:` under those two services).
#
# Do NOT also run this project's `nginx`/`certbot` services when using this
# file — they'd fight the host nginx for ports 80/443. Just never start
# them (`docker compose up` without naming `nginx`/`certbot`, or `docker
# compose stop nginx certbot` if they're already up) and never run
# deploy/init-certbot.sh.

server {
    server_name YOUR_DOMAIN_HERE;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Same "no trailing path after the port" rule as deploy/nginx.conf —
    # required so the admin app's basePath (/admin) sees the prefix it
    # expects on incoming requests instead of having it stripped.
    #
    # Port 7975 here matches docker-compose.prod.yml's admin service — NOT
    # 3000, deliberately, since 3000 is a very common default port and is
    # often already taken by something else on a shared server. If you
    # change the host port in docker-compose.prod.yml, change it here too.
    location /admin {
        proxy_pass http://127.0.0.1:7975;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public media (product images, invoice/packing-slip PDFs) — presigned
    # S3 URLs, signed against this domain (S3_PUBLIC_ENDPOINT in
    # docker-compose.prod.yml) so the browser can fetch/PUT them directly.
    # EDIT ME if you changed S3_BUCKET from the default 'ome-media' — this
    # location must match the bucket name exactly, since forcePathStyle
    # puts it first in the URL path.
    #
    # Port 19000 here matches docker-compose.prod.yml's minio service —
    # NOT 9000, deliberately, for the same reason admin uses 7975 instead
    # of 3000: 9000 is MinIO's own common default and easily already taken
    # by something else on a shared server. If you change the host port in
    # docker-compose.prod.yml, change it here too.
    #
    # No trailing slash on proxy_pass (same reasoning as /admin above) AND
    # an explicit Host header (nginx does NOT default to preserving the
    # original one) — both the path and the Host are part of what's
    # cryptographically signed in a presigned S3 URL, so both must reach
    # minio byte-for-byte unchanged or signature validation fails. Verified
    # against a real MinIO + nginx setup before writing this, not assumed.
    location /ome-media/ {
        proxy_pass http://127.0.0.1:19000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- keep everything below from your EXISTING Certbot-managed config as-is ---
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Keep your existing HTTP -> HTTPS redirect server block as-is too — it
# doesn't need any changes for this to work.
