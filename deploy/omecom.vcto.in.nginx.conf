# Complete, ready-to-use replacement for
# /etc/nginx/sites-available/omecom.vcto.in — the old static-site
# root/index/try_files block is gone (replaced by the two proxy_pass
# blocks below), everything Certbot-managed is untouched.
#
# Deploy with:
#   sudo cp deploy/omecom.vcto.in.nginx.conf /etc/nginx/sites-available/omecom.vcto.in
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    server_name omecom.vcto.in;

    access_log /var/log/nginx/omecom.vcto.in.access.log;
    error_log  /var/log/nginx/omecom.vcto.in.error.log;

    client_max_body_size 20m;

    # admin app (Next.js, basePath: /admin) — proxy_pass has NO trailing
    # path after the port, so nginx forwards the request URI unchanged
    # (e.g. /admin/login stays /admin/login). With a trailing slash here,
    # nginx would strip the /admin prefix before forwarding, which breaks
    # the admin app's basePath — it expects to SEE /admin on incoming
    # requests.
    location /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # storefront app (Next.js, domain root) — catch-all for everything
    # that isn't /admin*.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/omecom.vcto.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/omecom.vcto.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = omecom.vcto.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name omecom.vcto.in;
    return 404; # managed by Certbot


}
